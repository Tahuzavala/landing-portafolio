<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alex Zavala</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600..900&family=Instrument+Sans:wght@400;500;600&display=swap');

  :root {
    --paper: #F5F2EC;
    --rust: #C24A1E;
    --rust-dark: #9C3B17;
    --ink: #2A211C;
    --sage: #7C9385;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--paper);
    background-image:
      radial-gradient(circle at 20% 30%, rgba(0,0,0,0.02) 0%, transparent 50%),
      radial-gradient(circle at 80% 70%, rgba(0,0,0,0.02) 0%, transparent 50%);
    color: var(--ink);
    font-family: 'Instrument Sans', sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 6vh 6vw;
  }

  .stage {
    width: 100%;
    max-width: 1000px;
    display: grid;
    grid-template-columns: 1.3fr 1fr;
    gap: 4rem;
    align-items: center;
  }

  /* ---------- Entrada: cada bloque "cae y se pega" en secuencia ---------- */
  @keyframes settle-in {
    0%   { opacity: 0; transform: translateY(-46px) rotate(-5deg); }
    55%  { opacity: 1; transform: translateY(8px) rotate(1.6deg); }
    75%  { transform: translateY(-4px) rotate(-0.8deg); }
    90%  { transform: translateY(2px) rotate(0.3deg); }
    100% { opacity: 1; transform: translateY(0) rotate(0deg); }
  }

  .enter {
    opacity: 0;
    animation: settle-in 0.85s cubic-bezier(.34, 1.56, .64, 1) forwards;
  }

  .enter-headline { animation-delay: 0.05s; }
  .enter-portrait { animation-delay: 0.25s; }
  .enter-body     { animation-delay: 0.45s; grid-column: 1 / -1; }
  .enter-actions  { animation-delay: 0.65s; grid-column: 1 / -1; }

  /* ---------- Temblor sutil e infinito (distinto por elemento) ---------- */
  @keyframes tremor-headline {
    0%   { transform: rotate(-0.6deg) translate(0, 0); }
    25%  { transform: rotate(-0.35deg) translate(0.5px, -0.5px); }
    50%  { transform: rotate(-0.85deg) translate(-0.5px, 0.5px); }
    75%  { transform: rotate(-0.5deg) translate(0.3px, 0.2px); }
    100% { transform: rotate(-0.6deg) translate(0, 0); }
  }

  @keyframes tremor-card {
    0%   { transform: rotate(0deg) translate(0, 0); }
    30%  { transform: rotate(0.6deg) translate(1px, -1px); }
    55%  { transform: rotate(-0.4deg) translate(-1px, 0.5px); }
    80%  { transform: rotate(0.3deg) translate(0.5px, 1px); }
    100% { transform: rotate(0deg) translate(0, 0); }
  }

  @keyframes tremor-btn-a {
    0%   { transform: rotate(0deg) translateY(0); }
    40%  { transform: rotate(-0.7deg) translateY(-1px); }
    70%  { transform: rotate(0.5deg) translateY(0.5px); }
    100% { transform: rotate(0deg) translateY(0); }
  }

  @keyframes tremor-btn-b {
    0%   { transform: rotate(0deg) translateX(0); }
    35%  { transform: rotate(0.6deg) translateX(1px); }
    65%  { transform: rotate(-0.8deg) translateX(-0.5px); }
    100% { transform: rotate(0deg) translateX(0); }
  }

  .headline {
    font-family: 'Fraunces', serif;
    font-weight: 900;
    color: var(--rust);
    font-size: clamp(2.6rem, 7vw, 4.6rem);
    line-height: 0.92;
    letter-spacing: -0.01em;
    text-transform: uppercase;
    animation: tremor-headline 7.2s ease-in-out infinite;
    animation-delay: -1.8s;
  }

  .headline span {
    display: block;
  }

  .headline .tagline {
    font-size: 0.3em;
    font-family: 'Instrument Sans', sans-serif;
    font-weight: 500;
    letter-spacing: 0;
    text-transform: none;
    color: var(--rust-dark);
    margin-top: 0.4em;
  }

  .portrait-wrap {
    position: relative;
    transform: rotate(2deg);
  }

  .portrait-card {
    background: var(--ink);
    width: 100%;
    max-width: 280px;
    padding: 14px;
    border-radius: 2px;
    box-shadow: 0 10px 22px rgba(42, 33, 28, 0.14);
    position: relative;
    animation: tremor-card 9.4s ease-in-out infinite;
    animation-delay: -3.1s;
  }

  .portrait-img {
    display: block;
    width: 100%;
    aspect-ratio: 4 / 5;
    object-fit: cover;
  }

  .corner {
    position: absolute;
    width: 20px;
    height: 20px;
    z-index: 2;
  }

  .corner-tl { top: 8px; left: 8px; border-top: 2px solid var(--rust); border-left: 2px solid var(--rust); }
  .corner-tr { top: 8px; right: 8px; border-top: 2px solid var(--rust); border-right: 2px solid var(--rust); }
  .corner-bl { bottom: 8px; left: 8px; border-bottom: 2px solid var(--rust); border-left: 2px solid var(--rust); }
  .corner-br { bottom: 8px; right: 8px; border-bottom: 2px solid var(--rust); border-right: 2px solid var(--rust); }

  .body-copy {
    max-width: 62ch;
    font-size: 1.05rem;
    line-height: 1.55;
    color: var(--ink);
    margin-top: 1rem;
  }

  .body-copy strong {
    font-weight: 700;
    color: var(--ink);
  }

  .actions {
    display: flex;
    gap: 1rem;
    flex-wrap: wrap;
    margin-top: 0.5rem;
  }

  .btn-shake {
    display: inline-block;
  }

  .btn-shake-1 {
    animation: tremor-btn-a 6.3s ease-in-out infinite;
    animation-delay: -0.9s;
  }

  .btn-shake-2 {
    animation: tremor-btn-b 8.6s ease-in-out infinite;
    animation-delay: -4.2s;
  }

  .btn {
    font-family: 'Instrument Sans', sans-serif;
    font-weight: 500;
    font-size: 1rem;
    color: var(--paper);
    background: var(--rust);
    border: none;
    padding: 0.95rem 2rem;
    border-radius: 999px;
    cursor: pointer;
    text-decoration: none;
    display: inline-block;
    box-shadow: 0 4px 10px rgba(42, 33, 28, 0.12);
    transition: transform 0.15s ease, background 0.15s ease, box-shadow 0.15s ease;
  }

  .btn:hover {
    background: var(--rust-dark);
    transform: translateY(-4px);
    box-shadow: 0 12px 24px rgba(42, 33, 28, 0.28);
  }

  .btn:focus-visible {
    outline: 3px solid var(--ink);
    outline-offset: 3px;
  }

  @media (max-width: 720px) {
    .stage {
      grid-template-columns: 1fr;
      gap: 2.5rem;
      text-align: left;
    }
    .enter-portrait { order: -1; }
    .portrait-wrap { max-width: 260px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .enter { opacity: 1; animation: none; transform: none; }
    .headline, .portrait-card, .btn-shake-1, .btn-shake-2 { animation: none; }
  }
</style>
</head>
<body>

<div class="stage">

  <div class="enter enter-headline">
    <div class="headline">
      <span>Soy Alex</span>
      <span>Zavala</span>
      <span class="tagline">Hago marketing, publicidad y datos que venden</span>
    </div>
  </div>

  <div class="enter enter-portrait">
    <div class="portrait-wrap">
      <div class="portrait-card">
        <img class="portrait-img" src="assets/foto-main.png" alt="Alex Zavala">
        <span class="corner corner-tl"></span>
        <span class="corner corner-tr"></span>
        <span class="corner corner-bl"></span>
        <span class="corner corner-br"></span>
      </div>
    </div>
  </div>

  <div class="enter enter-body">
    <p class="body-copy">
      Este es solo el <strong>main de mis proyectos</strong>. Si tienes la
      dirección de tu proyecto, escríbela en la barra del navegador.
      <strong>¿Quieres contactarme o ver mi book?</strong> Haz click en los
      botones debajo. Vamos a platicar.
    </p>
  </div>

  <div class="enter enter-actions actions">
    <span class="btn-shake btn-shake-1">
      <a class="btn" href="https://wa.me/525518212535?text=Hola%20Alex%2C%20vi%20tu%20p%C3%A1gina.%20%C2%BFHaces%20marketing%20digital%3F%20Me%20interesa%20que%20me%20ayudes%20con%20mi%20proyecto.">Contáctame</a>
    </span>
    <span class="btn-shake btn-shake-2">
      <a class="btn" href="https://www.alexavala.me/book/?utm_source=main&utm_medium=internal&utm_campaign=main_to_book">Ver mi Book</a>
    </span>
  </div>

</div>

</body>
</html>
